name: CI

# 发布前检查：push / PR 都跑同一套离线测试，任一环节非 0 退出即整体失败。
#
# 为什么是 windows-latest：套件都在 Windows 上实测通过（本机无 WSL 发行版，Linux/macOS 未实测）。
# 为什么是 20/22/24 矩阵：仓库没写 engines，按 20/22 = 常见 LTS、24 = DSH Desktop 实际内置的运行时；
#   三档已用**独立下载的** node 在干净环境逐套实测通过。
#
# npm ci 安装开发依赖；测试执行期间不访问外网，不下载壁纸，HTTP 测试仅用本地夹具。
# 已排除的步骤与原因（详见 tools/run-all.mjs 的 EXCLUDED）：
#   · fetch-wallpapers.mjs --check —— 要本机已备好 39 张 820MB 底图（图片不进 git ⇒ CI 上必然失败），
#     而且这个脚本本身就会**真实下载**，绝不能进 CI
#   · test-served-bytes.mjs —— 要 wallpapers/ 里的真实图片才能起供图路由（离线实测退出码 1）
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # npm test = node tools/run-all.mjs：跑完再汇总，任一套失败 ⇒ 退出码 1。
      # React 生命周期验证需要开发依赖；测试本身不做外网请求。
      - run: npm ci --no-audit --no-fund
      - run: npm run native:build
      - run: npm test
